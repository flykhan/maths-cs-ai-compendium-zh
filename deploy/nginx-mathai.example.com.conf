# mathai.example.com — 数学·计算机科学与 AI 知识大全（MkDocs Material 静态站点）
# 源仓库: https://github.com/flykhan/maths-cs-ai-compendium-zh
# 部署目录: /var/www/mathai.example.com  证书: *.example.com 泛域名（acme.sh）

server {
    listen 80;
    listen [::]:80;
    server_name mathai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mathai.example.com;

    root /var/www/mathai.example.com;
    index index.html;

    ssl_certificate     /etc/nginx/cert/cert.crt;
    ssl_certificate_key /etc/nginx/cert/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log /var/log/nginx/mathai.access.log;
    error_log  /var/log/nginx/mathai.error.log;

    # MkDocs 带 hash 的资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 目录式 URL（use_directory_urls）：/chapter-01/ -> /chapter-01/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
