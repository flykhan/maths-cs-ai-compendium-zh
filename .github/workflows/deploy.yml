name: Deploy to mathai.example.com

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mathai
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --clean

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.MATHAI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MATHAI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.MATHAI_SSH_HOST }}
          SSH_PORT: ${{ secrets.MATHAI_SSH_PORT }}
          SSH_USER: ${{ secrets.MATHAI_SSH_USER }}
        run: |
          rsync -az --delete --stats \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes" \
            site/ "${SSH_USER}@${SSH_HOST}:/var/www/mathai.example.com/"
