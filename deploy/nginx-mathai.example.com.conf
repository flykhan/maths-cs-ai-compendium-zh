# mathai.example.com — 反向代理到 mathai 静态站点容器（127.0.0.1:19080）
# 源仓库: https://github.com/flykhan/maths-cs-ai-compendium-zh
# 镜像:   flykhan/mathai:latest （容器内 nginx 提供 site/ 静态文件）

server {
    listen 80;
    listen [::]:80;
    server_name mathai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mathai.example.com;

    ssl_certificate     /etc/nginx/cert/cert.crt;
    ssl_certificate_key /etc/nginx/cert/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log /var/log/nginx/mathai.access.log;
    error_log  /var/log/nginx/mathai.error.log;

    # 静态文件与缓存头由容器内的 nginx 负责，这里只做 TLS 终结与转发
    location / {
        proxy_pass http://127.0.0.1:19080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
