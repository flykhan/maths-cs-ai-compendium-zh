site_name: "数学、计算机科学与 AI 百科全书"
site_url: "https://flykhan.github.io/maths-cs-ai-compendium-zh/"
site_description: "一本开源的直觉优先教科书，从零开始覆盖数学、计算机科学和人工智能（中文翻译版）。"
site_author: "Henry Ndubuaku (flykhan 译)"
repo_url: "https://github.com/flykhan/maths-cs-ai-compendium-zh"
repo_name: "flykhan/maths-cs-ai-compendium-zh"

docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: slate
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
              tag: div
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/flykhan/maths-cs-ai-compendium-zh

